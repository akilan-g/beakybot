<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeakyBot | Intelligence in Nature</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            /* Apple-style smooth snapping */
            scroll-snap-type: y mandatory;
        }

        /* Top Nav - Apple Style */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        nav a {
            color: #f5f5f7;
            text-decoration: none;
            font-size: 12px;
            padding: 0 20px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        nav a:hover { opacity: 1; }

        /* Full Screen Section */
        section {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            position: relative;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; /* This makes it fill the screen like Apple */
        }

        /* Hero Text Styles */
        .hero-title {
            text-align: center;
            z-index: 10;
        }

        .hero-title h1 {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .hero-title p {
            font-size: 24px;
            font-weight: 300;
            color: #86868b;
        }

        /* Assigning the images to sections as Backgrounds */
        #hero { background-color: #000; }
        
        /* The images are now part of the section itself */
        #behavior { 
            background-image: url('behavior.png'); 
        }
        
        #id { 
            background-image: url('bird-id.png'); 
        }

        /* Dark overlay for the footer section */
        #mission {
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            padding: 80px 20px;
        }

        .bento-box {
            max-width: 1000px;
            width: 100%;
            background: #161617;
            border-radius: 30px;
            padding: 60px;
            text-align: center;
        }

        .cta-btn {
            background: #0071e3;
            color: white;
            padding: 12px 24px;
            border-radius: 980px;
            text-decoration: none;
            font-weight: 400;
            font-size: 17px;
            margin-top: 30px;
            display: inline-block;
        }

        .cta-btn:hover { background: #0077ed; }

    </style>
</head>
<body>

    <nav>
        <a href="#hero">BeakyBot</a>
        <a href="#behavior">Behavior</a>
        <a href="#id">Recognition</a>
        <a href="#mission">Mission</a>
    </nav>

    <section id="hero">
        <div class="hero-title">
            <h1>beakybot</h1>
            <p>Intelligence that flies further.</p>
        </div>
    </section>

    <section id="behavior"></section>

    <section id="id"></section>

    <section id="mission">
        <div class="bento-box">
            <h2 style="font-size: 48px; margin-bottom: 20px;">Designed for the wild.</h2>
            <p style="color: #86868b; font-size: 21px; max-width: 600px; margin: 0 auto;">Integrating community, technology, and conservation into one seamless experience.</p>
            <a href="#" class="cta-btn">Learn More</a>
        </div>
    </section>

</body>
</html>

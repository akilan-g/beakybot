<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeakyBot | AI Birding</title>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #4ade80;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            text-align: center;
        }
        .header { padding: 60px 20px; }
        h1 { font-size: 3rem; margin: 0; letter-spacing: -1px; }
        .tagline { opacity: 0.6; font-size: 1.2rem; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 50px;
            transition: transform 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); }
        
        h2 { color: var(--accent); }
        
        img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        
        .btn {
            background: var(--accent);
            color: #064e3b;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>beakybot</h1>
        <p class="tagline">Smart technology for deeper insights.</p>
    </div>

    <div class="container">
        <div class="card">
            <h2>AI Behavior Analysis</h2>
            <p>Monitor nesting, foraging, and social interactions.</p>
            <img src="behavior.png" alt="Bird Behavior Analysis">
        </div>

        <div class="card">
            <h2>Befriend a Bird</h2>
            <p>Recognize individual birds and track their visit history.</p>
            <img src="bird-id.png" alt="Bird ID Features">
        </div>

        <a href="mailto:contact@beakybot.io" class="btn">Contact for Conservation</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeakyBot | Animated Reveal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* (The CSS is largely the same, we just add the animation parts) */
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --apple-black: #000000; --apple-gray: #1d1d1f; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--apple-black);
            color: #fff;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
        }

        /* Minimalist Nav Bar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        nav a { color: #f5f5f7; text-decoration: none; font-size: 12px; padding: 0 22px; opacity: 0.8; }

        /* The Container */
        section {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: start;
            overflow: hidden;
            background-color: #fff; /* Most of your images have white backgrounds */
            position: relative;
        }

        #hero { background-color: var(--apple-black); }
        .hero-content h1 { font-size: clamp(48px, 10vw, 96px); font-weight: 700; letter-spacing: -0.04em; text-align: center; }

        /* --- THE NEW ANIMATION CSS --- */

        /* 1. Initial State (Hidden) */
        .apple-img {
            height: 100%;
            width: 100%;
            object-fit: contain;
            /* Start state: slightly scaled down and faded out */
            opacity: 0;
            transform: scale(0.95);
            /* Smooth transition timing */
            transition: opacity 1.2s cubic-bezier(0.25, 0.1, 0.25, 1.0),
                        transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. Final State (Visible) */
        /* This class is added by JavaScript when the user scrolls */
        .is-active .apple-img {
            opacity: 1;
            transform: scale(1);
        }

        /* Hero Text Fade In (Starts on load) */
        .fade-in { animation: appleFade 1.5s ease; }
        @keyframes appleFade { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            section { height: auto; min-height: 100vh; scroll-snap-align: none; }
            .apple-img { height: auto; width: 100%; opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#hero">BeakyBot</a>
        <a href="#behavior">AI Behavior</a>
        <a href="#id">Bird ID</a>
        <a href="#mission">Our Mission</a>
    </nav>

    <section id="hero">
        <div class="hero-content fade-in">
            <h1>beakybot.</h1>
            <p style="color: #86868b; font-size: 24px; text-align: center;">Technology for the wild.</p>
        </div>
    </section>

    <section id="behavior" style="background-color: #fbfbfb;" class="js-scroll">
        <img src="behavior.png" class="apple-img" alt="Advanced AI Analysis">
    </section>

    <section id="id" style="background-color: #fbfbfb;" class="js-scroll">
        <img src="bird-id.png" class="apple-img" alt="Individual Bird Identification">
    </section>

    <section id="mission" style="background-color: #000;">
        <div style="max-width: 600px; text-align: center; padding: 20px;">
            <h2 style="font-size: 48px; margin-bottom: 20px;">Protecting the Sky.</h2>
            <p style="color: #86868b; font-size: 21px;">Join our community of conservationists.</p>
            <a href="#" style="background: #0071e3; color: white; padding: 12px 24px; border-radius: 980px; text-decoration: none; display: inline-block; margin-top: 30px;">Notify Me</a>
        </div>
    </section>

    <script>
        // Find all sections that should animate
        const scrollSections = document.querySelectorAll('.js-scroll');

        // Set up the Intersection Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    // When section is in view, add the active class
                    entry.target.classList.add('is-active');
                    
                    // (Optional) Stop observing once it's triggered
                    // observer.unobserve(entry.target);
                } else {
                    // Remove class when it leaves view so it animates again
                    // (Remove this 'else' block if you want it to only animate once)
                    entry.target.classList.remove('is-active');
                }
            });
        }, {
            // How much of the section should be visible before animating (0.1 = 10%)
            threshold: 0.2
        });

        // Tell the observer to watch each section
        scrollSections.forEach((section) => {
            observer.observe(section);
        });
    </script>

</body>
</html>
